[project]
name = "champollion-agents"
version = "0.1.0"
description = "LangGraph ACP agents wrapping the Champollion sulcal pipeline"
requires-python = ">=3.11,<3.13"
authors = [{name = "Neurospin"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sse-starlette>=3.0",
  "httpx>=0.27",
  "langchain-core>=1.0",
  "langchain>=1.0",
  "langchain-openai>=0.3",
  "langgraph>=1.0",
  "langchain-mcp-adapters>=0.3",
  "chromadb>=0.5",
  "langchain-chroma>=0.1",
  "gradio>=5.0",
  "pandas>=2.0",
  "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/champollion_agents"]

[tool.ruff]
line-length = 120
exclude = [".pixi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit", "integration"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
