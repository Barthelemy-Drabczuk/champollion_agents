[workspace]
name = "champollion-agents"
platforms = ["linux-64"]
channels = ["conda-forge"]

[dependencies]
python = ">=3.11,<3.13"
pip = "*"

[pypi-dependencies]
champollion-agents = { path = ".", editable = true }
pytest = ">=8"
pytest-asyncio = ">=0.23"
pytest-cov = ">=5"
ruff = ">=0.6"
respx = ">=0.21"

[tasks]
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
format = "ruff format src tests"
test = "pytest"
test-unit = "pytest -m unit"
test-fast = "pytest -x"
test-cov = "pytest --cov=champollion_agents --cov-report=term-missing --cov-report=html"
run-technician = "uvicorn champollion_agents.technician.server:app --host 0.0.0.0 --port 8001"
run-analyst = "uvicorn champollion_agents.analyst.server:app --host 0.0.0.0 --port 8002"
run-gui = "python gui/app.py"
